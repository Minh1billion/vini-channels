[project]
name = "vinichannels"
version = "0.1.0"
description = "ViniChannels backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy[asyncio]>=2.0.35",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "argon2-cffi>=23.1",
  "PyJWT>=2.9",
  "httpx>=0.27",
  "cryptography>=43",
  "alembic>=1.13",
  "minio>=7.2",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "pywebpush>=2.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "import-linter>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vinichannels.adapters.outbound.persistence" = ["migrations/*.mako"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["vinichannels"]

[[tool.mypy.overrides]]
module = ["pywebpush", "py_vapid"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "vinichannels"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Các lớp chỉ phụ thuộc hướng vào trong"
type = "layers"
layers = [
  "vinichannels.bootstrap",
  "vinichannels.adapters",
  "vinichannels.application",
  "vinichannels.domain",
]

[[tool.importlinter.contracts]]
name = "Domain không import framework"
type = "forbidden"
source_modules = ["vinichannels.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "pydantic", "redis", "arq", "alembic", "jwt", "argon2", "minio", "PIL", "pillow_heif"]

[[tool.importlinter.contracts]]
name = "Application không import framework"
type = "forbidden"
source_modules = ["vinichannels.application"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "pydantic", "redis", "arq", "alembic", "jwt", "argon2", "minio", "PIL", "pillow_heif"]
